name: Build release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: qr-vault-linux
          - os: macos-latest
            artifact_name: qr-vault-macos
          - os: windows-latest
            artifact_name: qr-vault-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller
      - name: Build tkinter app (Linux)
        if: runner.os == 'Linux'
        run: pyinstaller --onedir --windowed --name QR-Vault --add-data "assets:assets" qr_gui_tk.py
      - name: Build tkinter app (macOS)
        if: runner.os == 'macOS'
        run: pyinstaller --onedir --windowed --name QR-Vault --icon assets/app_icon.icns --add-data "assets:assets" qr_gui_tk.py
      - name: Build tkinter app (Windows)
        if: runner.os == 'Windows'
        run: pyinstaller --onedir --windowed --name QR-Vault --icon assets/app_icon.ico --add-data "assets;assets" qr_gui_tk.py
      - name: Upload binary bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/QR-Vault*
